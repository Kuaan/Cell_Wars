<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cell Wars</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    <style>{style}</style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div id="score-board">SCORE: <span id="score-val">0</span></div>
            <div id="hp-bar-container"><div id="hp-bar"></div></div>
            <div id="connection-status">Connecting...</div>
            <div id="start-screen">
                <h1>CELL WARS</h1>
                <p>Tap to Start</p>
                <input type="text" id="username" placeholder="Enter Name" maxlength="8">
                <button id="btn-start">DEPLOY</button>
            </div>
        </div>

        <div id="joystick-zone"></div>
        
        <div id="action-zone">
            <button id="btn-skill" class="action-btn">⚡</button>
            <button id="btn-fire" class="action-btn">🔥</button>
        </div>
    </div>

    <script>
        // 設定全域變數供 JS 使用
        const ASSETS_BASE = "{assets_base}";
        const SOUNDS_BASE = "{sounds_base}";
        const SERVER_URL = "{server_url}";
        const VOL_BGM = {vol_bgm};
        const VOL_SFX = {vol_sfx};
    </script>

    <script>{audio_js}</script>
    <script>{drawing_js}</script>
    <script>{main_js}</script>
</body>
</html>
